name: Build and Deploy

on:
  workflow_run:
    workflows: ["Unit Test Coverage"]
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up runner disk space
        run: |
          echo "Disk before cleanup:"; df -h /
          # ubuntu-latest ships ~25 GB of preinstalled toolchains this build never uses
          # (Android SDK, .NET, GHC, boost). The monorepo Docker build + buildcache export
          # otherwise fills the ~14 GB free root partition and dies with
          # "No space left on device". Done inline (no third-party action) since this job
          # holds GITEA_NPM_TOKEN + packages:write.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "Disk after cleanup:"; df -h /

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Get short commit SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_COMMIT_SHORT=${{ steps.vars.outputs.short_sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_TAG=${{ github.ref_type == 'tag' && github.ref_name || '' }}
            GIT_DIRTY=false
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          # mode=min caches only final-image layers (not every intermediate stage),
          # keeping the buildcache blob small so cache-from/cache-to don't fill the runner.
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=min
          # Build secret consumed by `RUN --mount=type=secret,id=gitea_npm_token`
          # in the Dockerfile to authenticate pnpm against the Gitea npm registry
          # for @tidepool/* packages. Never lands in an image layer.
          secrets: |
            gitea_npm_token=${{ secrets.GITEA_NPM_TOKEN }}
