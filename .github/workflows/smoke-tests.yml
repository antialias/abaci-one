name: Build Smoke Tests Image

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/e2e/smoke/**'
      # The image also carries the two setup files the smoke tests depend on.
      - 'apps/web/e2e/auth.setup.ts'
      - 'apps/web/e2e/tier.setup.ts'
      - 'apps/web/e2e/session-cookie.ts'
      - 'apps/web/scripts/smoke-test-runner.ts'
      - 'apps/web/Dockerfile.smoke-tests'
      - 'apps/web/playwright.config.ts'
      - '.github/workflows/smoke-tests.yml'
      - '.dockerignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-smoke-tests

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and load the image first, and check that Playwright can load
      # every smoke test in it, before anything is pushed: the cron pulls
      # :latest, so an image missing a file the tests import would otherwise
      # replace a good one and run zero tests (2026-11-28).
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.smoke-tests
          load: true
          push: false
          tags: smoke-tests:check
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          secrets: |
            gitea_npm_token=${{ secrets.GITEA_NPM_TOKEN }}

      - name: Check the smoke tests load
        run: |
          out=$(docker run --rm -e BASE_URL=https://abaci.one smoke-tests:check \
            npx playwright test smoke --list 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | tail -5
          total=$(echo "$out" | sed -n 's/^Total: \([0-9][0-9]*\) tests\{0,1\} in.*/\1/p' | tail -1)
          if [ -z "$total" ] || [ "$total" -eq 0 ]; then
            echo "The smoke image lists no tests."; exit 1
          fi

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.smoke-tests
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          # Build secret consumed by `RUN --mount=type=secret,id=gitea_npm_token`
          # in Dockerfile.smoke-tests to authenticate pnpm against the Gitea npm
          # registry for @tidepool/* packages. Never lands in an image layer.
          secrets: |
            gitea_npm_token=${{ secrets.GITEA_NPM_TOKEN }}
