# OpenClaw Gateway scrape wiring — codifies the off-cluster NAS hauntbot metrics.
# The gateway runs on the NAS (192.168.86.51:18789), outside the cluster, so it is
# scraped via a headless Service + manually-managed Endpoints + a ServiceMonitor,
# the same off-cluster idiom as dns-exporter / claude-usage-exporter. Series carry
# job="openclaw-gateway". Applied via null_resource.openclaw_scrape.
#
# Metrics come from OpenClaw's official `diagnostics-prometheus` plugin, installed
# on the gateway 2026-08-30 (home-infra #99), plus the supported image-baked
# `openclaw-task-observability` companion plugin for failure classes absent from
# the native exporter (tool-loop blocks and completed-run/delivery reconciliation).
# Both endpoints use gateway operator auth, so the ServiceMonitor reads a bearer
# token from the `openclaw-gateway-token` Secret.
#
# THE SECRET IS NOT IN GIT and is not created by Terraform. Create/rotate it with:
#
#   ssh -p 2222 730op.synology.me \
#     'set -a; . ~/projects/openclaw-deploy/.env; set +a; printf %s "$OPENCLAW_GATEWAY_TOKEN"' \
#     > /tmp/oc-token \
#   && kubectl create secret generic openclaw-gateway-token -n monitoring \
#        --from-file=token=/tmp/oc-token --dry-run=client -o yaml | kubectl apply -f - \
#   ; rm -f /tmp/oc-token
#
# If the Secret is missing the target goes down with a 401 — that is the expected
# symptom, not a plugin failure. Verify with:
#   kubectl -n monitoring exec prometheus-kube-prometheus-stack-prometheus-0 -c prometheus -- \
#     wget -qO- 'http://localhost:9090/api/v1/targets?state=active' | grep openclaw
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-gateway
  namespace: monitoring
  labels:
    app: openclaw-gateway
spec:
  # Headless + no selector: endpoints managed manually (object below) — external host.
  clusterIP: None
  ports:
    - name: metrics
      port: 18789
      targetPort: 18789
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: openclaw-gateway
  namespace: monitoring
  labels:
    app: openclaw-gateway
subsets:
  - addresses:
      - ip: 192.168.86.51
    ports:
      - name: metrics
        port: 18789
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openclaw-gateway
  namespace: monitoring
  labels:
    app: openclaw-gateway
spec:
  selector:
    matchLabels:
      app: openclaw-gateway
  endpoints:
    - port: metrics
      path: /api/diagnostics/prometheus
      scheme: http
      interval: 60s
      scrapeTimeout: 30s
      authorization:
        type: Bearer
        credentials:
          name: openclaw-gateway-token
          key: token
    - port: metrics
      path: /api/openclaw-task-observability/metrics
      scheme: http
      interval: 60s
      scrapeTimeout: 30s
      authorization:
        type: Bearer
        credentials:
          name: openclaw-gateway-token
          key: token
