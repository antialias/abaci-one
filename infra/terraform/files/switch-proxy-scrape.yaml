# claude-switch-proxy scrape wiring — the routing plane's only durable voice.
#
# The proxy runs on the NAS (192.168.86.51:8787), outside the cluster, so it is
# scraped through the same off-cluster idiom as openclaw-gateway /
# claude-usage-exporter / yoto-bridge: headless Service + manually-managed
# Endpoints + ServiceMonitor. Series carry job="switch-proxy". Applied by
# null_resource.switch_proxy_scrape.
#
# WHY THIS EXISTS: the proxy's degraded-member health store keeps its evidence
# in a 600 s / 256-sample in-memory ring that dies with the process. Without
# this scrape, "what did the classifier do overnight" has no answer anywhere in
# the system — which is exactly what happened on 2026-09-03, when the only two
# real degradations of the day were lost to a deploy restart. Prometheus holds
# the history; the proxy's counters are free to reset.
# Source: home-infra-agent-resources/services/claude-switch-proxy,
# docs/degraded-failover/60-spec-v2.md §6.2(1).
#
# AUTH — the proxy is default-deny (README.md "Client auth (the LAN gate)"):
# every path except GET /_switch/healthz requires
# `Authorization: Bearer <SWITCH_CLIENT_SECRET>`, and /_switch/metrics is not
# exempted. The ServiceMonitor reads that bearer from the
# `switch-proxy-client-secret` Secret in this namespace (key: token — the same
# convention as openclaw-gateway-token).
#
# THIS IS NOT A NEW SECRET. It must hold the value already live on the NAS as
# SWITCH_CLIENT_SECRET_FILE (nas/docker-compose.yml), i.e. the contents of
# /volume1/homes/antialias/projects/claude-switch/app/client_secret. A
# mismatched value presents as a 401 on the target, not as a proxy fault. The
# secret is NOT in git and is NOT managed by Terraform — create or rotate it
# from the file so the value never reaches argv or shell history:
#
#   kubectl create secret generic switch-proxy-client-secret -n monitoring \
#     --from-file=token=$HOME/.claude-switch-proxy/client_secret \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Verify the target is up:
#   kubectl -n monitoring exec prometheus-kube-prometheus-stack-prometheus-0 \
#     -c prometheus -- wget -qO- \
#     'http://localhost:9090/api/v1/targets?state=active' | grep switch-proxy
#
# SCRAPE ONLY — no PrometheusRule here. Alerting is under a standing moratorium
# (platform#13). Collecting metrics is instrumentation; adding an alert rule is
# a separate, explicit decision. Do not "finish the job" by adding one.
---
apiVersion: v1
kind: Service
metadata:
  name: switch-proxy
  namespace: monitoring
  labels:
    app: switch-proxy
spec:
  # Headless + no selector: the endpoints below are managed by hand, because the
  # target is an external host.
  clusterIP: None
  ports:
    - name: metrics
      port: 8787
      targetPort: 8787
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: switch-proxy
  namespace: monitoring
  labels:
    app: switch-proxy
subsets:
  - addresses:
      - ip: 192.168.86.51
    ports:
      - name: metrics
        port: 8787
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: switch-proxy
  namespace: monitoring
  labels:
    app: switch-proxy
spec:
  selector:
    matchLabels:
      app: switch-proxy
  endpoints:
    - port: metrics
      path: /_switch/metrics
      scheme: http
      interval: 60s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: switch-proxy-client-secret
          key: token
